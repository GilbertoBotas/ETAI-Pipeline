# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text", "prior_offenses", "age_in_months", "juvenile_total"]

# Keep these values fixed when comparing models. The test rows are used only
# after cross-validation has selected a model.
test_set:
  size: 0.2
  random_state: 42

# Every candidate uses these same development-set folds and scoring rule.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1

# New this week (see Practical/W3/notebooks/01_eda_introduction.ipynb): what src/data_diagnostics.py
# and src/preprocessing.py need to stay generic instead of hardcoding COMPAS's column names.
diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  numeric_text_columns: ["priors_count", "prior_offenses"]
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (see the EDA notebook's correlation heatmap + VIF section) --
  # also listed in data.drop_columns above; kept here too so preprocessing.py doesn't need
  # to reach into the data: section to know what to drop
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# New this week (see Practical/W3/notebooks/02_preprocessing.ipynb): this week's diagnosis-driven,
# leak-safe preprocessing recipe. encoder/scaler chosen by the empirical grid in that notebook --
# don't hand-pick a different pair here without re-running the grid.
preprocessing:
  encoder: "target"      # winner of the 4x4 empirical grid (onehot/ordinal/count/target x none/standard/minmax/robust),
  scaler: "robust"     # scored on accuracy across 15 repeated splits -- see 02_preprocessing.ipynb's grid + paired check
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count", "priors_per_adult_year", "juvenile_offense_total", "age_priors_interaction"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"   # applies to sex, age_cat, c_charge_degree

feature_engineering:
  enabled: true
  columns: ["priors_per_adult_year", "juvenile_offense_total", "age_priors_interaction"]

models:
  - type: "dummy"
    params: {}
  - type: "logistic_regression"
    params: {max_iter: 2000}
  - type: "decision_tree"
    params: {random_state: 42}
  - type: "random_forest"
    params: {random_state: 42, n_jobs: -1}
  - type: "oblique_random_forest"
    params: {n_estimators: 50, n_components: 10, random_state: 42, n_jobs: -1}
  - type: "adaboost"
    params: {max_depth: 1, n_estimators: 50, learning_rate: 1.0, random_state: 42}

# Inner CV chooses hyperparameters; the five outer cv folds above estimate how
# well the complete tuning procedure performs. More trials/folds cost more fits.
tuning:
  enabled: true
  n_splits: 3
  random_state: 42
  n_trials:
    logistic_regression: 6
    decision_tree: 6
    random_forest: 6
    oblique_random_forest: 6
    adaboost: 6
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100.0, log: true}
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__n_estimators: {type: categorical, choices: [50, 100]}
      model__max_depth: {type: categorical, choices: [4, 8, 12, null]}
      model__min_samples_leaf: {type: int, low: 1, high: 50, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", "log2", 0.5]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 20}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 100, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 5}
      model__n_estimators: {type: int, low: 25, high: 100, log: true}
      model__learning_rate: {type: float, low: 0.03, high: 1.0, log: true}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
